# Reusable template: builds one build type, optionally runs tests,
# installs the executables into dist/<build-type>/bin and uploads them.
name: Build Bike Parking

on:
  workflow_call:
    inputs:
      preset:
        description: "CMake preset: debug, release or test"
        required: true
        type: string
      run-tests:
        description: "Run ctest for this preset"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install compiler, Ninja and Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libgl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libfontconfig1-dev libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libxcb-xkb-dev

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"

      - name: Install Qt 6.8.3
        # The presets expect Qt in $HOME/Qt/6.8.3/gcc_64; the runner's home is /home/runner.
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: gcc_64
          dir: /home/runner/Qt

      - name: Configure ${{ inputs.preset }}
        run: cmake --preset ${{ inputs.preset }}

      - name: Build ${{ inputs.preset }} (installs into dist/${{ inputs.preset }})
        run: cmake --build --preset ${{ inputs.preset }}

      - name: Run tests
        if: inputs.run-tests
        run: ctest --preset ${{ inputs.preset }}

      - name: Check the install
        run: |
          test -n "$(ls -A dist/${{ inputs.preset }}/bin)" || { echo "dist/${{ inputs.preset }}/bin is empty"; exit 1; }
          ls -l dist/${{ inputs.preset }}/bin

      - name: Upload dist/${{ inputs.preset }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ inputs.preset }}
          path: dist/${{ inputs.preset }}
          if-no-files-found: error
          retention-days: 14
