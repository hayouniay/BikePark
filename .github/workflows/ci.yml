# Two stages:
#   Stage 1 "test":  builds and runs the unit tests on its own. It uses no output from the builds.
#   Stage 2 "build": builds debug and release. Runs only when stage 1 passes.
name: Bike Parking CI

on:
  push:
    branches: [ "master", "feature/*", "hotfix/*" ]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Stage 1 · test
    uses: ./.github/workflows/build-template.yml
    with:
      preset: test
      run-tests: true

  build:
    name: Stage 2 · build ${{ matrix.preset }}
    needs: test
    strategy:
      fail-fast: true
      matrix:
        preset: [debug, release]
    uses: ./.github/workflows/build-template.yml
    with:
      preset: ${{ matrix.preset }}
      run-tests: false
